<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --surface: #ffffff;
        --border: #d8e0ea;
        --text: #14213d;
        --muted: #5f6b7a;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
        --high: #dc2626;
        --medium: #d97706;
        --low: #15803d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, rgba(37, 99, 235, 0.14), transparent 30%), var(--bg);
        color: var(--text);
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 24px 40px;
      }

      .page-header {
        margin-bottom: 28px;
      }

      .page-header h1 {
        margin: 0 0 12px;
        font-size: 2.2rem;
        letter-spacing: 0.02em;
      }

      .page-header .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
        max-width: 44rem;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, minmax(240px, 1fr));
        gap: 20px;
      }

      .kanban-column {
        position: relative;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px;
        min-height: 340px;
        box-shadow: 0 14px 35px rgba(20, 33, 61, 0.08);
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .kanban-column:hover {
        transform: translateY(-2px);
      }

      .kanban-column::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, rgba(37, 99, 235, 0.95), rgba(37, 99, 235, 0.25));
      }

      .column-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .column-header h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .column-count {
        background: var(--accent-soft);
        color: var(--accent);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .task-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .task-card {
        border: 1px solid transparent;
        border-radius: 14px;
        padding: 16px;
        background: #fcfdff;
        cursor: grab;
        box-shadow: 0 12px 24px rgba(20, 33, 61, 0.06);
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .task-card:hover {
        border-color: rgba(37, 99, 235, 0.2);
        box-shadow: 0 18px 34px rgba(20, 33, 61, 0.1);
      }

      .task-card:active {
        cursor: grabbing;
        transform: translateY(1px);
      }

      .task-card.dragging {
        opacity: 0.6;
        transform: rotate(2deg) scale(1.02);
      }

      .kanban-column.drag-over {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 2px var(--accent-soft), 0 14px 35px rgba(37, 99, 235, 0.08);
      }

      .empty-column {
        margin: 0;
        padding: 18px;
        border: 1px dashed var(--border);
        border-radius: 14px;
        color: var(--muted);
        text-align: center;
        background: rgba(219, 234, 254, 0.35);
      }

      .task-card h3 {
        margin: 0 0 8px;
        font-size: 1rem;
      }

      .task-card .description {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.4;
      }

      .task-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        font-size: 0.9rem;
      }

      .task-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .due-date {
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.08);
        color: var(--accent);
      }

      .overdue-pill {
        display: inline-flex;
        align-items: center;
        padding: 4px 8px;
        border-radius: 999px;
        font-weight: 700;
        background: rgba(220, 38, 38, 0.12);
        color: var(--high);
      }

      .filter-button {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        padding: 10px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
      }

      .filter-button.active {
        background: rgba(37, 99, 235, 0.1);
        border-color: rgba(37, 99, 235, 0.4);
        color: var(--accent);
      }

      .priority {
        display: inline-flex;
        align-items: center;
        padding: 4px 8px;
        border-radius: 999px;
        font-weight: 700;
        color: #fff;
      }

      .priority.high {
        background: var(--high);
      }

      .priority.medium {
        background: var(--medium);
      }

      .priority.low {
        background: var(--low);
      }

      .assignee {
        color: var(--muted);
      }

      .edit-button {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
      }

      .edit-button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .page-actions {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 16px;
      }

      .new-task-button {
        border: none;
        background: var(--accent);
        color: white;
        padding: 12px 18px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        box-shadow: 0 16px 28px rgba(37, 99, 235, 0.18);
        transition: transform 0.2s ease, background-color 0.2s ease;
      }

      .new-task-button:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(20, 33, 61, 0.58);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 1000;
      }

      .modal-overlay.open {
        display: flex;
      }

      .modal-dialog {
        background: var(--surface);
        border-radius: 18px;
        width: min(100%, 560px);
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        padding: 26px;
        box-shadow: 0 30px 70px rgba(20, 33, 61, 0.18);
        border: 1px solid rgba(37, 99, 235, 0.08);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .modal-title {
        margin: 0;
        font-size: 1.2rem;
      }

      .modal-close-button {
        border: none;
        background: transparent;
        font-size: 1.2rem;
        cursor: pointer;
        color: var(--muted);
      }

      .modal-body {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .modal-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .modal-field label {
        font-weight: 700;
        color: var(--text);
      }

      .modal-field input,
      .modal-field select,
      .modal-field textarea {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        font: inherit;
        background: #fff;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .modal-field input:focus,
      .modal-field select:focus,
      .modal-field textarea:focus {
        outline: none;
        border-color: rgba(37, 99, 235, 0.8);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
      }

      .modal-field input.input-error,
      .modal-field textarea.input-error,
      .modal-field select.input-error {
        border-color: var(--high);
      }

      .field-error,
      .form-error {
        color: var(--high);
        font-size: 0.9rem;
      }

      .form-error {
        display: none;
        margin-top: 4px;
      }

      .comments-section {
        border-top: 1px solid var(--border);
        margin-top: 4px;
        padding-top: 12px;
      }

      .comments-list {
        margin: 0;
        padding-left: 18px;
        color: var(--text);
        max-height: 140px;
        overflow-y: auto;
      }

      .comments-list:empty::before {
        content: "No comments yet.";
        color: var(--muted);
        margin-left: -18px;
        display: block;
      }

      .comments-controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
      }

      .comment-submit {
        align-self: flex-end;
        border: none;
        border-radius: 8px;
        padding: 8px 12px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
      }

      .comment-count {
        color: var(--muted);
        font-weight: 700;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 12px;
      }

      .modal-actions button {
        border-radius: 10px;
        padding: 12px 16px;
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        min-width: 110px;
      }

      .modal-actions .secondary {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
      }

      .modal-actions .secondary:hover {
        transform: translateY(-1px);
        border-color: rgba(37, 99, 235, 0.3);
        color: var(--accent);
      }

      .modal-actions .primary {
        border: none;
        background: var(--accent);
        color: white;
      }

      .modal-actions .primary:hover {
        background: #1d4ed8;
      }

      @media (max-width: 800px) {
        .board {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <h1>Task Tracker</h1>
        <p class="subtitle">Keep work moving from planning to completion.</p>
      </header>

      <div class="page-actions">
        <button type="button" class="new-task-button" id="new-task-button">
          New Task
        </button>
        <button type="button" class="filter-button" id="overdue-filter-button">
          Show overdue
        </button>
      </div>

      <main class="board" aria-label="Task tracker kanban board">
        <section class="kanban-column" data-status="ToDo">
          <div class="column-header">
            <h2>To Do</h2>
            <span class="column-count">1</span>
          </div>

          <div class="task-list" aria-live="polite"></div>
        </section>

        <section class="kanban-column" data-status="InProgress">
          <div class="column-header">
            <h2>In Progress</h2>
            <span class="column-count">1</span>
          </div>

          <div class="task-list" aria-live="polite"></div>
        </section>

        <section class="kanban-column" data-status="Done">
          <div class="column-header">
            <h2>Done</h2>
            <span class="column-count">1</span>
          </div>

          <div class="task-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <div class="modal-overlay" id="task-modal-overlay" aria-hidden="true">
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
        <div class="modal-header">
          <h2 class="modal-title" id="task-modal-title">New Task</h2>
          <button type="button" class="modal-close-button" id="task-modal-close" aria-label="Close dialog">
            ×
          </button>
        </div>
        <div class="modal-body">
          <div class="modal-field">
            <label for="task-title">Title</label>
            <input id="task-title" name="title" type="text" placeholder="Enter task title" />
            <div class="field-error" id="task-title-error" aria-live="polite"></div>
          </div>
          <div class="modal-field">
            <label for="task-description">Description</label>
            <textarea id="task-description" name="description" rows="4" placeholder="Add details"></textarea>
          </div>
          <div class="modal-field">
            <label for="task-status">Status</label>
            <select id="task-status" name="status">
              <option value="ToDo">To Do</option>
              <option value="InProgress">In Progress</option>
              <option value="Done">Done</option>
            </select>
          </div>
          <div class="modal-field">
            <label for="task-priority">Priority</label>
            <select id="task-priority" name="priority">
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
          <div class="modal-field">
            <label for="task-due-date">Due Date</label>
            <input id="task-due-date" name="due_date" type="date" />
          </div>
          <div class="modal-field">
            <label for="task-assignee">Assignee</label>
            <input id="task-assignee" name="assignee" type="text" placeholder="Who is responsible?" />
          </div>
          <section class="comments-section" id="task-comments-section" hidden>
            <label for="task-comment-input"><strong>Comments</strong></label>
            <ul class="comments-list" id="task-comments-list"></ul>
            <div class="comments-controls">
              <textarea
                id="task-comment-input"
                rows="2"
                placeholder="Add a comment"
              ></textarea>
              <div class="field-error" id="task-comment-error" aria-live="polite"></div>
              <button type="button" class="comment-submit" id="task-comment-submit">Add Comment</button>
            </div>
          </section>
          <input id="task-id" name="taskId" type="hidden" />
          <div class="form-error" id="task-form-error" role="alert"></div>
          <div class="modal-actions">
            <button type="button" class="secondary" id="task-modal-cancel">Cancel</button>
            <button type="button" class="primary" id="task-modal-submit">Save</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const BASE_URL = "http://127.0.0.1:8001";
      const STATUS_ORDER = ["ToDo", "InProgress", "Done"];
      const PRIORITY_ORDER = {
        High: 0,
        Medium: 1,
        Low: 2,
      };
      const ALLOWED_TRANSITIONS = {
        ToDo: ["InProgress"],
        InProgress: ["Done"],
        Done: ["InProgress"],
      };

      let tasks = [];
      let draggedTaskId = null;
      let currentModalMode = "create";
      let currentTaskId = null;
      let currentTaskOriginalStatus = null;

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function sortTasks(taskList) {
        return [...taskList].sort((left, right) => {
          const leftPriority = PRIORITY_ORDER[left.priority] ?? 99;
          const rightPriority = PRIORITY_ORDER[right.priority] ?? 99;
          const priorityDifference = leftPriority - rightPriority;

          if (priorityDifference !== 0) {
            return priorityDifference;
          }

          return String(left.id || "").localeCompare(String(right.id || ""));
        });
      }

      function getTasksForStatus(status) {
        return sortTasks(tasks.filter((task) => task.status === status));
      }

      function canMoveTaskToStatus(currentStatus, targetStatus) {
        return (ALLOWED_TRANSITIONS[currentStatus] || []).includes(targetStatus);
      }

      function getTaskComments(task) {
        return Array.isArray(task?.comments) ? task.comments : [];
      }

      function findTaskById(taskId) {
        if (!taskId && taskId !== 0) {
          return null;
        }
        return tasks.find((item) => String(item.id) === String(taskId));
      }

      async function updateTaskStatus(taskId, targetStatus) {
        try {
          const response = await fetch(`${BASE_URL}/tasks/${taskId}`, {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ status: targetStatus }),
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => null);
            const detail = typeof errorData?.detail === "string"
              ? errorData.detail
              : `Request failed with status ${response.status}`;

            if (response.status === 404) {
              await fetchTasks();
              throw new Error("Task no longer exists. The board was refreshed.");
            }

            if (response.status === 422) {
              throw new Error("That move is not allowed by the current workflow.");
            }

            throw new Error(detail);
          }

          await fetchTasks();
        } catch (error) {
          console.error("Unable to update task status", error);
          alert(error?.message || "Unable to update task status.");
        }
      }

      function isTaskOverdue(task) {
        if (!task?.due_date || task.status === "Done") {
          return false;
        }

        const today = new Date().toISOString().slice(0, 10);
        return String(task.due_date) < today;
      }

      function renderBoard(taskList) {
        tasks = Array.isArray(taskList) ? taskList : [];

        document.querySelectorAll(".kanban-column").forEach((column) => {
          const status = column.dataset.status;
          const columnTasks = getTasksForStatus(status);
          const countElement = column.querySelector(".column-count");
          const listElement = column.querySelector(".task-list");

          if (countElement) {
            countElement.textContent = String(columnTasks.length);
          }

          if (!listElement) {
            return;
          }

          listElement.innerHTML = "";

          if (columnTasks.length === 0) {
            const emptyState = document.createElement("p");
            emptyState.className = "empty-column";
            emptyState.textContent = "No tasks";
            listElement.appendChild(emptyState);
            return;
          }

          columnTasks.forEach((task) => {
            const card = document.createElement("article");
            card.className = "task-card";
            card.dataset.taskId = task.id || "";
            card.dataset.status = status;
            card.draggable = true;

            card.addEventListener("dragstart", (event) => {
              const taskId = String(task.id ?? "");
              draggedTaskId = taskId;
              event.dataTransfer?.setData("text/plain", taskId);
              event.dataTransfer?.setData("application/task-id", taskId);
              if (event.dataTransfer) {
                event.dataTransfer.effectAllowed = "move";
              }
              card.classList.add("dragging");
            });

            card.addEventListener("dragend", () => {
              draggedTaskId = null;
              card.classList.remove("dragging");
              document.querySelectorAll(".kanban-column").forEach((column) => {
                column.classList.remove("drag-over");
              });
            });

            const title = escapeHtml(task.title || "Untitled task");
            const description = escapeHtml(task.description || "");
            const priority = escapeHtml(task.priority || "Medium");
            const assignee = escapeHtml(task.assignee || "Unassigned");
            const dueDate = task.due_date ? escapeHtml(task.due_date) : "";
            const overdue = isTaskOverdue(task);
            const commentCount = getTaskComments(task).length;

            card.innerHTML = `
              <h3>${title}</h3>
              <p class="description">${description}</p>
              <div class="task-meta">
                <span class="priority ${priority.toLowerCase()}">${priority}</span>
                <span class="assignee">${assignee}</span>
              </div>
              <div class="task-footer">
                ${dueDate ? `<span class="due-date">Due ${dueDate}</span>` : ""}
                ${overdue ? `<span class="overdue-pill">Overdue</span>` : ""}
                <span class="comment-count">Comments ${commentCount}</span>
              </div>
              <button type="button" class="edit-button">Edit</button>
            `;

            const editButton = card.querySelector(".edit-button");
            editButton?.addEventListener("click", (event) => {
              event.stopPropagation();
              openModal(task);
            });

            listElement.appendChild(card);
          });
        });
      }

      async function fetchTasks(overdue = null) {
        try {
          const params = new URLSearchParams();
          if (overdue !== null) {
            params.set("overdue", String(overdue));
          }

          const url = `${BASE_URL}/tasks${params.toString() ? `?${params.toString()}` : ""}`;
          const response = await fetch(url);

          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }

          const data = await response.json();
          renderBoard(data);
        } catch (error) {
          console.error("Unable to load tasks", error);
          renderBoard([]);
        }
      }

      function attachColumnListeners() {
        document.querySelectorAll(".kanban-column").forEach((column) => {
          column.addEventListener("dragover", (event) => {
            event.preventDefault();

            const taskId = draggedTaskId || event.dataTransfer?.getData("application/task-id") || event.dataTransfer?.getData("text/plain");
            const task = findTaskById(taskId);

            if (task && canMoveTaskToStatus(task.status, column.dataset.status)) {
              column.classList.add("drag-over");
            } else {
              column.classList.remove("drag-over");
            }
          });

          column.addEventListener("dragleave", () => {
            column.classList.remove("drag-over");
          });

          column.addEventListener("drop", async (event) => {
            event.preventDefault();
            column.classList.remove("drag-over");

            const taskId = draggedTaskId || event.dataTransfer?.getData("application/task-id") || event.dataTransfer?.getData("text/plain");
            const task = findTaskById(taskId);

            if (!task) {
              return;
            }

            if (!canMoveTaskToStatus(task.status, column.dataset.status)) {
              return;
            }

            await updateTaskStatus(task.id, column.dataset.status);
          });
        });
      }

      function clearModalErrors() {
        const titleInput = document.getElementById("task-title");
        const titleError = document.getElementById("task-title-error");
        const formError = document.getElementById("task-form-error");
        const commentInput = document.getElementById("task-comment-input");
        const commentError = document.getElementById("task-comment-error");

        titleInput?.classList.remove("input-error");
        commentInput?.classList.remove("input-error");
        titleError && (titleError.textContent = "");
        commentError && (commentError.textContent = "");
        if (formError) {
          formError.textContent = "";
          formError.style.display = "none";
        }
      }

      function renderTaskComments(task) {
        const commentsSection = document.getElementById("task-comments-section");
        const commentsList = document.getElementById("task-comments-list");
        const commentInput = document.getElementById("task-comment-input");
        const commentError = document.getElementById("task-comment-error");

        if (!commentsSection || !commentsList) {
          return;
        }

        if (!task) {
          commentsSection.hidden = true;
          commentsList.innerHTML = "";
          if (commentInput) {
            commentInput.value = "";
          }
          if (commentError) {
            commentError.textContent = "";
          }
          return;
        }

        commentsSection.hidden = false;
        commentsList.innerHTML = "";

        getTaskComments(task).forEach((comment) => {
          const listItem = document.createElement("li");
          listItem.textContent = comment;
          commentsList.appendChild(listItem);
        });

        if (commentError) {
          commentError.textContent = "";
        }
      }

      function resetModalForm() {
        const titleInput = document.getElementById("task-title");
        const descriptionInput = document.getElementById("task-description");
        const statusInput = document.getElementById("task-status");
        const priorityInput = document.getElementById("task-priority");
        const dueDateInput = document.getElementById("task-due-date");
        const assigneeInput = document.getElementById("task-assignee");
        const taskIdInput = document.getElementById("task-id");
        const modalTitle = document.getElementById("task-modal-title");
        const submitButton = document.getElementById("task-modal-submit");
        const commentInput = document.getElementById("task-comment-input");

        if (titleInput) titleInput.value = "";
        if (descriptionInput) descriptionInput.value = "";
        if (statusInput) statusInput.value = "ToDo";
        if (priorityInput) priorityInput.value = "Medium";
        if (dueDateInput) dueDateInput.value = "";
        if (assigneeInput) assigneeInput.value = "";
        if (taskIdInput) taskIdInput.value = "";
        if (modalTitle) modalTitle.textContent = "New Task";
        if (submitButton) submitButton.textContent = "Create";
        if (commentInput) commentInput.value = "";

        currentModalMode = "create";
        currentTaskId = null;
        currentTaskOriginalStatus = null;
        clearModalErrors();
        renderTaskComments(null);
      }

      function openModal(task = null) {
        const overlay = document.getElementById("task-modal-overlay");
        const titleInput = document.getElementById("task-title");
        const descriptionInput = document.getElementById("task-description");
        const statusInput = document.getElementById("task-status");
        const priorityInput = document.getElementById("task-priority");
        const dueDateInput = document.getElementById("task-due-date");
        const assigneeInput = document.getElementById("task-assignee");
        const taskIdInput = document.getElementById("task-id");
        const modalTitle = document.getElementById("task-modal-title");
        const submitButton = document.getElementById("task-modal-submit");

        resetModalForm();

        if (task) {
          currentModalMode = "edit";
          currentTaskId = task.id || null;
          currentTaskOriginalStatus = task.status || null;
          if (modalTitle) modalTitle.textContent = "Edit Task";
          if (submitButton) submitButton.textContent = "Save";
          if (titleInput) titleInput.value = task.title || "";
          if (descriptionInput) descriptionInput.value = task.description || "";
          if (statusInput) statusInput.value = task.status || "ToDo";
          if (priorityInput) priorityInput.value = task.priority || "Medium";
          if (dueDateInput) dueDateInput.value = task.due_date || "";
          if (assigneeInput) assigneeInput.value = task.assignee || "";
          if (taskIdInput) taskIdInput.value = task.id || "";
          renderTaskComments(task);
        }

        if (overlay) {
          overlay.classList.add("open");
          overlay.setAttribute("aria-hidden", "false");
        }
        if (titleInput) {
          titleInput.focus();
        }
      }

      function closeModal() {
        const overlay = document.getElementById("task-modal-overlay");
        if (overlay) {
          overlay.classList.remove("open");
          overlay.setAttribute("aria-hidden", "true");
        }
        resetModalForm();
      }

      function showModalError(message) {
        const formError = document.getElementById("task-form-error");
        if (formError) {
          formError.textContent = message;
          formError.style.display = "block";
        }
      }

      function isStatusTransitionAllowed(currentStatus, nextStatus) {
        const allowedTransitions = {
          ToDo: ["InProgress"],
          InProgress: ["Done"],
          Done: ["InProgress"],
        };

        return (allowedTransitions[currentStatus] || []).includes(nextStatus);
      }

      function collectTaskPayload() {
        const titleInput = document.getElementById("task-title");
        const descriptionInput = document.getElementById("task-description");
        const statusInput = document.getElementById("task-status");
        const priorityInput = document.getElementById("task-priority");
        const dueDateInput = document.getElementById("task-due-date");
        const assigneeInput = document.getElementById("task-assignee");

        const title = titleInput?.value?.trim() || "";
        const description = descriptionInput?.value || "";
        const status = statusInput?.value || "ToDo";
        const priority = priorityInput?.value || "Medium";
        const dueDate = dueDateInput?.value?.trim() || "";
        const assignee = assigneeInput?.value?.trim() || "";

        const payload = {
          title,
          description: description || "",
          status,
          priority,
          assignee: assignee ? assignee : null,
        };

        if (dueDate !== "") {
          payload.due_date = dueDate;
        } else if (currentModalMode === "edit") {
          payload.due_date = null;
        }

        return payload;
      }

      async function submitTask() {
        clearModalErrors();

        const titleInput = document.getElementById("task-title");
        const titleError = document.getElementById("task-title-error");
        const payload = collectTaskPayload();

        if (!payload.title) {
          titleInput?.classList.add("input-error");
          if (titleError) {
            titleError.textContent = "Title is required";
          }
          titleInput?.focus();
          return;
        }

        if (currentModalMode === "edit" && currentTaskOriginalStatus) {
          if (payload.status === currentTaskOriginalStatus) {
            delete payload.status;
          } else if (!isStatusTransitionAllowed(currentTaskOriginalStatus, payload.status)) {
            showModalError(
              `Status cannot change from ${currentTaskOriginalStatus} to ${payload.status}.`
            );
            return;
          }
        }

        const url = currentModalMode === "edit" && currentTaskId
          ? `${BASE_URL}/tasks/${currentTaskId}`
          : `${BASE_URL}/tasks`;
        const method = currentModalMode === "edit" ? "PATCH" : "POST";

        try {
          const response = await fetch(url, {
            method,
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          if (response.ok) {
            closeModal();
            await fetchTasks();
            return;
          }

          if (response.status === 422) {
            const errorData = await response.json().catch(() => null);
            const detail = typeof errorData?.detail === "string"
              ? errorData.detail
              : Array.isArray(errorData?.detail)
                ? errorData.detail.map((item) => item?.msg).filter(Boolean).join("; ")
                : "The server rejected this task.";
            showModalError(detail);
            return;
          }

          const errorData = await response.json().catch(() => null);
          const detail = typeof errorData?.detail === "string"
            ? errorData.detail
            : "Unable to save task.";
          showModalError(detail);
        } catch (error) {
          console.error("Unable to save task", error);
          showModalError("Unable to save task.");
        }
      }

      async function submitComment() {
        const commentInput = document.getElementById("task-comment-input");
        const commentError = document.getElementById("task-comment-error");
        const comment = commentInput?.value ?? "";

        if (!currentTaskId) {
          return;
        }

        commentInput?.classList.remove("input-error");
        if (commentError) {
          commentError.textContent = "";
        }

        if (!comment.trim()) {
          commentInput?.classList.add("input-error");
          if (commentError) {
            commentError.textContent = "Comment is required";
          }
          commentInput?.focus();
          return;
        }

        try {
          const response = await fetch(`${BASE_URL}/tasks/${currentTaskId}/comments`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ comment }),
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => null);
            const detail = typeof errorData?.detail === "string"
              ? errorData.detail
              : Array.isArray(errorData?.detail)
                ? errorData.detail.map((item) => item?.msg).filter(Boolean).join("; ")
                : `Unable to add comment (${response.status}).`;
            throw new Error(detail);
          }

          const updatedTask = await response.json();
          tasks = tasks.map((task) => String(task.id) === String(updatedTask.id) ? updatedTask : task);
          renderBoard(tasks);
          renderTaskComments(updatedTask);
          if (commentInput) {
            commentInput.value = "";
          }
        } catch (error) {
          console.error("Unable to add comment", error);
          commentInput?.classList.add("input-error");
          if (commentError) {
            commentError.textContent = error?.message || "Unable to add comment.";
          }
        }
      }

      function attachModalListeners() {
        const openButton = document.getElementById("new-task-button");
        const closeButton = document.getElementById("task-modal-close");
        const cancelButton = document.getElementById("task-modal-cancel");
        const overlay = document.getElementById("task-modal-overlay");
        const submitButton = document.getElementById("task-modal-submit");
        const submitCommentButton = document.getElementById("task-comment-submit");
        const dialog = overlay?.querySelector(".modal-dialog");

        openButton?.addEventListener("click", () => openModal());
        closeButton?.addEventListener("click", closeModal);
        cancelButton?.addEventListener("click", closeModal);
        submitButton?.addEventListener("click", submitTask);
        submitCommentButton?.addEventListener("click", submitComment);

        overlay?.addEventListener("click", (event) => {
          if (event.target === overlay) {
            closeModal();
          }
        });

        dialog?.addEventListener("click", (event) => {
          event.stopPropagation();
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            closeModal();
          }
        });
      }

      function updateOverdueFilterButton(overdueActive) {
        const button = document.getElementById("overdue-filter-button");
        if (!button) {
          return;
        }

        if (overdueActive) {
          button.classList.add("active");
          button.textContent = "Showing overdue";
        } else {
          button.classList.remove("active");
          button.textContent = "Show overdue";
        }
      }

      function attachFilterListeners() {
        const button = document.getElementById("overdue-filter-button");
        let overdueActive = false;

        button?.addEventListener("click", async () => {
          overdueActive = !overdueActive;
          updateOverdueFilterButton(overdueActive);
          await fetchTasks(overdueActive ? true : null);
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        attachColumnListeners();
        attachModalListeners();
        attachFilterListeners();
        fetchTasks();
      });
    </script>
  </body>
</html>
